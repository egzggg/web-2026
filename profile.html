<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="profile.css">
</head>
<body class="body">
    <header class="header">
        <ul class="header__menu">
            <li><img class="header__menu-image" src="images/Menu_Item1.png" alt="home"></li>
            <li ><img class="header__menu-image" src="images/Menu_Item3.png" alt="personal-home"></li>
            <li><img class="header__menu-image" src="images/Menu_Item2.png" alt="add-photo"></li>
        </ul>
    </header>
    <main class="main">
        <h1 class="main__head"></h1>
        <div class="user-feed">
            <div class="user-feed-icon">
                <img class="photo-profile" src="images/larch4x.png" alt="larch">
            </div>
            <p class="user-feed-name">Ваня Денисов</p>
            <p class="user-feed-description">Привет! Я системный аналитик в ACME :) Тут моя жизнь только для самых классных!</p>
            <div class="user-feed-button">
                <img class="user-feed-button__photo" src="images/logo-photo-galery.png" alt="logo">
                <span class="user-feed-button__span">43 поста</span>
            </div>
            <div class="user-feed-photos">
                <img class="user-feed-photos__photo-user" src="images/photo-user/winter.png" alt="fish">
                <img class="user-feed-photos__photo-user" src="images/photo-user/bottle.png" alt="fish">
                <img class="user-feed-photos__photo-user" src="images/photo-user/puncake.png" alt="fish">
                <img class="user-feed-photos__photo-user" src="images/photo-user/party.png" alt="fish">
                <img class="user-feed-photos__photo-user" src="images/photo-user/rocletcoffee.png" alt="fish">
                <img class="user-feed-photos__photo-user" src="images/photo-user/oldbook.png" alt="fish">
                <img class="user-feed-photos__photo-user" src="images/photo-user/street.png" alt="fish">
                <img class="user-feed-photos__photo-user" src="images/fish.png" alt="fish">
                <img class="user-feed-photos__photo-user" src="images/photo-user/people.png" alt="fish">
            </div>
        </div>
    </main>
</body>
</html>
